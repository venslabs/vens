# vens-demo contexts/internal.yaml at 1dd6971, with the schema 2 marker and
# the listener its notes give.
schema_version: 2
project:
  name: "nightly-report"
  description: "Internal batch job producing an aggregated sales report"
context:
  exposure: "internal"
  data_sensitivity: "low"
  business_criticality: "low"
  availability_requirement: "low"
  compliance_requirements: []
  audit_requirement: "low"
  listener: "absent"
  controls:
    waf: false
    ddos_protection: false
    ids: true
    siem: true
    edr: true
    antivirus: false
    segmentation: true
    zero_trust: false
  notes: "No ingress and no listening socket. Runs once a night, reads a pre-validated CSV from an internal bucket, writes an aggregate to a private database, then exits."
