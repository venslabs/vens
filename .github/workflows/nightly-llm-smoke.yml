# Nightly smoke test against the real LLM providers (issue #175).
#
# The unit tests and the --llm=mock testscripts never touch a real API, so a
# response-format change on a provider side would go unnoticed until a user
# hit it. This workflow runs `vens generate` against each real provider on a
# tiny report and asserts a valid *scored* VEX.
#
# Keys come from repo secrets. A provider whose key secret is absent is
# skipped gracefully (the job succeeds with a notice), so the workflow stays
# green on forks and before secrets are configured — and it never runs on
# pull requests, so PRs from forks cannot exfiltrate keys.
#
# Ollama runs in its own job, deliberately *without* any cloud provider key
# in its env: a job holding API keys must never pipe an installer into a
# shell. Ollama is installed from a pinned release asset whose SHA-256 is
# verified before extraction.
name: Nightly LLM smoke test
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: openai
            key_env: OPENAI_API_KEY
          - provider: anthropic
            key_env: ANTHROPIC_API_KEY
          - provider: googleai
            key_env: GOOGLE_API_KEY
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Build vens
        run: go build -o vens ./cmd/vens

      - name: Smoke test ${{ matrix.provider }}
        env:
          PROVIDER: ${{ matrix.provider }}
          KEY_ENV: ${{ matrix.key_env }}
        run: |
          if [ -z "${!KEY_ENV}" ]; then
            echo "::notice::Skipping $PROVIDER smoke test: the $KEY_ENV secret is not set."
            exit 0
          fi
          ./vens generate --llm="$PROVIDER" \
            --config-file=.github/llm-smoke/config.yaml \
            --sbom-serial-number=urn:uuid:3e671687-395b-41f5-a30f-a58921a69b79 \
            .github/llm-smoke/report.json vex.cdx.json
          python3 .github/llm-smoke/check-vex.py vex.cdx.json

  ollama:
    # Ollama needs a local server, not a repo secret, so it runs in its own
    # job whose env holds NO cloud provider keys. The server is installed
    # from a pinned ollama release asset with SHA-256 verification — never
    # an unpinned installer piped into sh.
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Build vens
        run: go build -o vens ./cmd/vens

      - name: Install pinned Ollama
        run: |
          set -euo pipefail
          OLLAMA_VERSION="v0.40.7"
          OLLAMA_SHA256="7f082e625b4c334df84ed1558fe282d6d8091fe3545790aef30b3a9c50d44d41"
          curl -fsSL -o "$RUNNER_TEMP/ollama-linux-amd64.tar.zst" \
            "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          echo "${OLLAMA_SHA256}  $RUNNER_TEMP/ollama-linux-amd64.tar.zst" | sha256sum -c -
          # tar needs the zstd filter program to extract the release tarball
          if ! command -v zstd > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          fi
          mkdir -p "$RUNNER_TEMP/ollama"
          tar -xf "$RUNNER_TEMP/ollama-linux-amd64.tar.zst" -C "$RUNNER_TEMP/ollama"
          OLLAMA_BIN="$(find "$RUNNER_TEMP/ollama" -name ollama -type f -executable | head -n 1)"
          test -n "$OLLAMA_BIN"
          echo "$(dirname "$OLLAMA_BIN")" >> "$GITHUB_PATH"
          rm "$RUNNER_TEMP/ollama-linux-amd64.tar.zst"

      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            ollama list > /dev/null 2>&1 && break
            sleep 2
          done
          ollama pull qwen2.5:0.5b

      - name: Smoke test ollama
        env:
          OLLAMA_MODEL: qwen2.5:0.5b
        run: |
          ./vens generate --llm=ollama \
            --config-file=.github/llm-smoke/config.yaml \
            --sbom-serial-number=urn:uuid:3e671687-395b-41f5-a30f-a58921a69b79 \
            .github/llm-smoke/report.json vex.cdx.json
          python3 .github/llm-smoke/check-vex.py vex.cdx.json
