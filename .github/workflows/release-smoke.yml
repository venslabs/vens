name: Release smoke

# CI compiles a throwaway binary with a plain `go build`; the release ships
# something else: `make artifacts` output, cross-compiled with -trimpath, -s -w
# and the version injected through ldflags. Nothing ever ran that. This builds
# the real archives and executes the Windows one.

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  # A sentinel no fallback can produce: with fetch-depth 1 there are no tags, so
  # a broken ldflags injection would fall through to debug.ReadBuildInfo() and
  # print a commit SHA. Asserting on a SHA would pass either way.
  SMOKE_VERSION: v0.0.0-smoke
  SBOM_SERIAL: urn:uuid:3e671687-395b-41f5-a30f-a58921a69b79

jobs:
  artifacts:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same setup-go inputs as release.yml, so this builds on the toolchain the
      # release picks, not the one CI picks.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: Compile binaries
        run: make artifacts VERSION="$SMOKE_VERSION"

      - name: List artifacts
        run: ls -l _output

      - name: Upload the Windows archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-archives
          path: _output/vens-*-windows-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  windows-amd64:
    name: Run vens.exe (windows/amd64)
    needs: artifacts
    runs-on: windows-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the Windows archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-archives
          path: dist

      # tar.exe is the extraction step the install docs hand to users.
      - name: Unpack the archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          foreach ($arch in @('amd64', 'arm64')) {
            $archive = "dist/vens-$env:SMOKE_VERSION-windows-$arch.tar.gz"
            if (-not (Test-Path $archive)) { throw "missing release archive: $archive" }
            $members = @(tar.exe -tzf $archive)
            if ($LASTEXITCODE -ne 0) { throw "tar.exe could not list $archive" }
            if (($members -join ',') -ne 'vens.exe') {
              throw "$archive should hold exactly vens.exe, holds: $($members -join ', ')"
            }
            Write-Host "$archive -> $($members -join ', ') ($((Get-Item $archive).Length) bytes)"
          }

          New-Item -ItemType Directory -Force bin | Out-Null
          tar.exe -xzf "dist/vens-$env:SMOKE_VERSION-windows-amd64.tar.gz" -C bin
          if ($LASTEXITCODE -ne 0) { throw 'tar.exe could not extract the amd64 archive' }
          if (-not (Test-Path bin/vens.exe)) { throw 'vens.exe is not where the archive said it was' }
          Write-Host "extracted bin/vens.exe ($((Get-Item bin/vens.exe).Length) bytes)"
          exit 0

      - name: vens.exe --version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $got = (& ./bin/vens.exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "vens.exe --version exited $LASTEXITCODE" }
          Write-Host "vens.exe --version -> $got"

          $want = "vens version $env:SMOKE_VERSION"
          if ($got -ne $want) { throw "expected '$want', got '$got' - the ldflags version injection is broken" }
          exit 0

      - name: vens.exe generate --help
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $help = (& ./bin/vens.exe generate --help | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "vens.exe generate --help exited $LASTEXITCODE" }
          Write-Host $help
          foreach ($flag in @('--config-file', '--sbom-serial-number', '--llm')) {
            if ($help -notmatch [regex]::Escape($flag)) { throw "generate --help does not mention $flag" }
          }
          exit 0

      - name: vens.exe generate, end to end
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          New-Item -ItemType Directory -Force work | Out-Null
          ./bin/vens.exe generate --llm=mock `
            --config-file examples/quickstart/config.yaml `
            --sbom-serial-number $env:SBOM_SERIAL `
            examples/quickstart/reports/python-slim.trivy.json `
            work/out.cdx.json
          if ($LASTEXITCODE -ne 0) { throw "generate exited $LASTEXITCODE" }
          if (-not (Test-Path work/out.cdx.json)) { throw 'generate produced no VEX' }

          $vex = Get-Content work/out.cdx.json -Raw | ConvertFrom-Json
          if ($vex.bomFormat -ne 'CycloneDX') { throw "bomFormat is '$($vex.bomFormat)'" }
          if ($vex.specVersion -ne '1.6') { throw "specVersion is '$($vex.specVersion)'" }
          if ($vex.serialNumber -notmatch '^urn:uuid:') { throw "serialNumber is '$($vex.serialNumber)'" }

          $vulns = @($vex.vulnerabilities)
          if ($vulns.Count -lt 1) { throw 'the VEX carries no vulnerabilities' }
          $rated = @($vulns | Where-Object { $_.ratings.method -contains 'OWASP' }).Count
          if ($rated -ne $vulns.Count) { throw "only $rated of $($vulns.Count) vulnerabilities carry an OWASP rating" }

          $first = $vulns[0]
          Write-Host "VEX: $($vulns.Count) vulnerabilities, all OWASP-rated"
          Write-Host "first: $($first.id) score $($first.ratings[0].score) ($($first.ratings[0].severity)) $($first.ratings[0].vector)"
          exit 0

      # os.Rename over an existing file is the Windows-specific path issue #241
      # calls out. Run it twice over the same destination.
      - name: vens.exe generate over an existing output file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $before = (Get-FileHash work/out.cdx.json -Algorithm SHA256).Hash
          ./bin/vens.exe generate --llm=mock `
            --config-file examples/quickstart/config.yaml `
            --sbom-serial-number $env:SBOM_SERIAL `
            examples/quickstart/reports/python-slim.trivy.json `
            work/out.cdx.json
          if ($LASTEXITCODE -ne 0) { throw "rerun over an existing output exited $LASTEXITCODE" }

          $vex = Get-Content work/out.cdx.json -Raw | ConvertFrom-Json
          if (@($vex.vulnerabilities).Count -lt 1) { throw 'the rerun left an empty VEX behind' }

          $after = (Get-FileHash work/out.cdx.json -Algorithm SHA256).Hash
          if ($before -eq $after) { throw 'the rerun did not replace the output file' }
          Write-Host "rename over an existing file: $before -> $after"
          exit 0

      - name: A failed run must not damage the output file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $before = (Get-FileHash work/out.cdx.json -Algorithm SHA256).Hash

          $env:VENS_MOCK_LLM_FAIL = '1'
          ./bin/vens.exe generate --llm=mock `
            --config-file examples/quickstart/config.yaml `
            --sbom-serial-number $env:SBOM_SERIAL `
            examples/quickstart/reports/python-slim.trivy.json `
            work/out.cdx.json
          $failed = $LASTEXITCODE
          if ($failed -eq 0) { throw 'the injected LLM failure did not fail the run' }
          Write-Host "injected failure exited $failed, as it should"

          $after = (Get-FileHash work/out.cdx.json -Algorithm SHA256).Hash
          if ($before -ne $after) { throw 'a failed run modified the existing output file' }

          ./bin/vens.exe generate --llm=mock `
            --config-file examples/quickstart/config.yaml `
            --sbom-serial-number $env:SBOM_SERIAL `
            examples/quickstart/reports/python-slim.trivy.json `
            work/absent.cdx.json
          if ($LASTEXITCODE -eq 0) { throw 'the injected LLM failure did not fail the run' }
          Remove-Item Env:VENS_MOCK_LLM_FAIL

          if (Test-Path work/absent.cdx.json) { throw 'a failed run left a partial output file behind' }
          $leftovers = @(Get-ChildItem work -Filter '.vens-*.tmp' -Force)
          if ($leftovers.Count -gt 0) { throw "temp files left behind: $($leftovers.Name -join ', ')" }

          Write-Host "existing output unchanged ($before), no partial file, no temp leftovers"
          exit 0
