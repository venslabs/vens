<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- contextes -->
  <rect x="20" y="40" width="180" height="70" rx="10" fill="#f4f6f8" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="110" y="68" text-anchor="middle" font-size="14" fill="#334155">config.yaml</text>
  <text x="110" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">internal</text>

  <rect x="20" y="210" width="180" height="70" rx="10" fill="#f4f6f8" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="110" y="238" text-anchor="middle" font-size="14" fill="#334155">config.yaml</text>
  <text x="110" y="260" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">internet-facing</text>

  <!-- vens -->
  <rect x="270" y="120" width="150" height="80" rx="10" fill="#e8f2fb" stroke="#1d6fb8" stroke-width="2"/>
  <text x="345" y="155" text-anchor="middle" font-size="17" font-weight="700" fill="#1d6fb8">vens</text>
  <text x="345" y="177" text-anchor="middle" font-size="12.5" fill="#1d6fb8">CycloneDX VEX</text>

  <path d="M200 75 C240 75 240 145 268 148" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M200 245 C240 245 240 175 268 172" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- meme CVE, deux scores -->
  <text x="470" y="66" font-size="12.5" fill="#64748b">same CVE, same component</text>

  <!-- CI gate -->
  <rect x="470" y="80" width="370" height="90" rx="10" fill="#fbfdff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="490" y="106" font-size="14" font-weight="700" fill="#0f172a">CI gate</text>
  <circle cx="497" cy="132" r="6" fill="#16a34a"/>
  <text x="512" y="137" font-size="13" fill="#334155">internal, score 2.0</text>
  <text x="700" y="137" font-size="13" font-weight="600" fill="#16a34a">build passes</text>
  <circle cx="497" cy="156" r="6" fill="#dc2626"/>
  <text x="512" y="161" font-size="13" fill="#334155">internet-facing, score 22.5</text>
  <text x="700" y="161" font-size="13" font-weight="600" fill="#dc2626">build fails</text>

  <!-- Dependency-Track -->
  <rect x="470" y="195" width="370" height="105" rx="10" fill="#fbfdff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="490" y="221" font-size="14" font-weight="700" fill="#0f172a">Dependency-Track 5.1+</text>
  <text x="490" y="246" font-size="13" fill="#334155">the OWASP vector and score land on the finding,</text>
  <text x="490" y="266" font-size="13" fill="#334155">with the audit trail that says where they came from</text>
  <text x="490" y="288" font-size="12" font-style="italic" fill="#64748b">per finding, so both projects keep their own score</text>

  <path d="M422 148 C445 148 445 125 468 125" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M422 172 C445 172 445 245 468 245" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
