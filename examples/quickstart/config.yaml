# vens - Vulnerability Risk Scoring Configuration
# Reference: https://venslabs.github.io/vens/reference/config-schema/
#
# This config describes the deployment for the OWASP Risk Rating of its
# vulnerabilities. The LLM answers closed questions about EACH vulnerability
# within YOUR system context; vens computes every factor level, the severity
# and the score.
# Methodology: https://owasp.org/www-community/OWASP_Risk_Rating_Methodology

schema_version: 2

project:
  name: "python-backend-api"
  description: "Python 3.11 backend API service handling customer data"

context:
  # ============================================================================
  # MANDATORY FIELDS - Define your system's risk profile
  # ============================================================================

  # EXPOSURE: How is the system exposed to attackers?
  # Values: internal | private | internet
  #   - internal: Corporate network only, no external access
  #   - private: Requires VPN / authenticated tunnel
  #   - internet: Publicly accessible
  # Impact: Sets Size (internal 4, private 6, internet 9) and the attacker group every question names
  exposure: "internet"

  # DATA SENSITIVITY: What type of data does the system handle?
  # Values: low | medium | high | critical
  #   - low: Public data
  #   - medium: Internal data, limited confidentiality
  #   - high: PII, financial data, customer info
  #   - critical: Secrets, PHI, payment card data
  # Impact: Picks the column of Loss of confidentiality (low and medium non-sensitive, high and critical critical);
  #         shown to the Motive, Loss of integrity and Privacy violation questions
  data_sensitivity: "high"

  # BUSINESS CRITICALITY: How critical is this system for business?
  # Values: low | medium | high | critical
  #   - low: Dev / test / sandbox
  #   - medium: Internal tools
  #   - high: Customer-facing, important operations
  #   - critical: Revenue-critical, compliance-required
  # Impact: Shown to the Motive, Financial damage and Reputation damage questions
  business_criticality: "high"

  # ============================================================================
  # WHAT IS IN PLACE - Optional, but each one left out takes the fallback its
  # Impact line states, with a warning at load; --strict refuses the run.
  # vens reads them alone: they are never sent to the LLM.
  # The values below illustrate the fields; declare what is true for yours.
  # ============================================================================

  # DATA SUBJECTS: How many distinct people's personal data can this service read?
  # Values: none | one_individual | hundreds | thousands | millions
  # Impact: Caps Privacy violation (none and one_individual 3, hundreds 5, thousands 7,
  #         millions 9); left out, no cap
  data_subjects: "thousands"

  # DETECTION: What records an attack attempt, on each channel, across the whole service?
  # Values: not_logged | logged | logged_and_reviewed, and active_in_application for application
  # Declare all three channels, or leave the key out.
  # Impact: Intrusion detection is the lowest level declared among the channels where
  #         the LLM says an attempt would show (not_logged 9, logged 8, logged_and_reviewed 3,
  #         active_in_application 1); left out, 9 on every finding
  detection:
    network: "logged"
    host: "not_logged"
    application: "logged"

  # TRACEABILITY: What records who did what, as it is, not as required?
  # Values: none | per_request | per_individual
  # Impact: Crossed with the LLM's answer for Loss of accountability; left out, the none column
  traceability: "per_request"

  # ============================================================================
  # OPTIONAL FIELDS - Provide additional context for precise scoring
  # ============================================================================

  # LISTENER: Does this deployment accept connections others open? (optional)
  # Values: present | absent | unknown
  # Default: unknown, not shown; nothing warns when it is left out
  # When to use: present for a service others connect to, such as this REST API;
  #              absent for a batch job, a CLI or a client that only opens connections
  # Impact: Shown in every call when present or absent
  listener: "present"

  # AVAILABILITY REQUIREMENT: How critical is uptime? (optional)
  # Values: low | medium | high | critical
  # Unset: reads primary; availability_requirement_missing counts CVEs with a usable v3 vector.
  # Impact: Picks the column of Loss of availability (low and medium secondary services,
  #         high and critical primary); never sent to the LLM
  availability_requirement: "high"

  # COMPLIANCE REQUIREMENTS: What regulations apply? (optional)
  # Supported: PCI-DSS, HIPAA, GDPR, SOC2, ISO27001, FISMA, FedRAMP, SOX, NIST, CCPA, CMMC, ITAR
  # Default: Empty (no compliance)
  # When to use: If non-compliance has legal/financial consequences
  # Impact: The Non-compliance question names them and the LLM judges the violation;
  #         empty, Non-compliance is 2 and the question is not asked
  compliance_requirements:
    - "GDPR"
    - "SOC2"

  # SECURITY CONTROLS: What defenses are in place? (optional)
  # Default: All false (no controls assumed)
  # When to use: You have active security controls in front of this service
  # Impact: waf, ddos_protection, segmentation, zero_trust and antivirus, when true, are shown
  #         with their scope to the Ease of exploit question; the LLM judges whether one stands
  #         in the way of each exploit. Declare what an IDS, a SIEM or an EDR records
  #         in detection above.
  controls:
    # Perimeter controls
    waf: true                    # Web Application Firewall (SQL injection, XSS, path traversal)
    ddos_protection: true        # DDoS mitigation (Availability / DoS CVEs)

    # Endpoint controls
    antivirus: false             # Antivirus/Anti-malware (Known malware signatures)

    # Network controls
    segmentation: true           # Network micro-segmentation (Lateral movement)
    zero_trust: false            # Zero-trust architecture (Authentication bypass, lateral movement)

  # ADDITIONAL NOTES: Free-form context (optional)
  # Default: Empty
  # When to use: Provide extra details that help understand risk (architecture, threat model, etc.)
  # Impact: Shown in every call; the LLM reads it on every question
  notes: "Customer-facing REST API built with FastAPI/Flask running on Python 3.11-slim (Debian). Handles authentication, user data, and payment processing. Uses PostgreSQL database. Deployed in Kubernetes behind load balancer. Container runs as non-root user. SSL/TLS terminated at load balancer. Rate limiting and input validation implemented. Regular security patches applied monthly."
